robot_controller:           # ROS2节点参数命名空间
  ros__parameters:
    robot_type: "scara"     # 机器人类型选择
    publish_tf: true        # TF坐标变换发布开关
    dh_parameters:          # D-H参数表（核心配置）
      - [0.1, 0.0, 0.1, 0.0]      # 关节1
      - [0.2, 1.5708, 0.0, 0.0]   # 关节2  
      - [0.15, 0.0, 0.0, 0.0]     # 关节3
      - [0.0, 0.0, 0.05, 0.0]     # 末端执行器

# D-H参数格式：[a, α, d, θ]
# a (连杆长度)：沿着x_i轴，从z_{i-1}轴移动到z_i轴的距离
# α (连杆扭转角)：绕着x_i轴，从z_{i-1}轴旋转到z_i轴的角度
# d (连杆偏距)：沿着z_{i-1}轴，从x_{i-1}轴移动到x_i轴的距离
# θ (关节角)：绕着z_{i-1}轴，从x_{i-1}轴旋转到x_i轴的角度